[package]
name = "nyx-weather"
version = "0.1.0"
description = "Weather for Omarchy: current conditions, hourly and 7-day forecasts, air quality, and bar integration"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-weather"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "47c5e0f328b4042df4c08fc317510644a64d1124" }
nyx-actions = { git = "https://github.com/design-nexus/nyx-core.git", rev = "47c5e0f328b4042df4c08fc317510644a64d1124", default-features = false }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d168cbfa57ee229df327f0c85abe5f4b75201b99" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d168cbfa57ee229df327f0c85abe5f4b75201b99" }
nyx-weather-core = { path = "../../crates/nyx-weather-core" }
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
